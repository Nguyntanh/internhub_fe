<div class="flex flex-col h-full bg-white shadow-md">
  <!-- Logo Section -->
  <div class="flex items-center justify-center h-16 border-b border-gray-200">
    <img src="assets/images/interhub.jpg" alt="InternHub Logo" class="h-8 w-auto mr-2">
    <span class="text-xl font-semibold text-gray-800" *ngIf="isSidebarVisible">InternHub</span>

      class="flex items-center text-gray-700 rounded-md bg-gray-100 font-medium"
      [ngClass]="{'px-4 py-2': isSidebarVisible, 'justify-center py-2 px-2': !isSidebarVisible}"
    >
      <!-- Icon Placeholder -->
      <svg class="h-5 w-5" [class.mr-3]="isSidebarVisible" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>

    <a

    <a
      href="#"

      [ngClass]="{'px-4 py-2': isSidebarVisible, 'justify-center py-2 px-2': !isSidebarVisible}"

      [ngClass]="{'px-4 py-2': isSidebarVisible, 'justify-center py-2 px-2': !isSidebarVisible}"
