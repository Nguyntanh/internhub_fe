<div class="flex flex-col h-full bg-white shadow-md">
  <!-- Logo Section -->
  <div class="flex items-center justify-center h-16 border-b border-gray-200">
    <img src="assets/images/interhub.jpg" alt="InternHub Logo" class="h-8 w-auto mr-2">
    <span class="text-xl font-semibold text-gray-800" *ngIf="isSidebarVisible">InternHub</span>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 px-2 py-4 space-y-3">
    <a
      *ngFor="let item of currentMenuItems"
      [routerLink]="item.routerLink"
      routerLinkActive="bg-gray-100 text-black font-semibold"
      [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
      class="flex items-center text-gray-700 rounded-md hover:bg-gray-100 text-lg"
      [ngClass]="{'px-4 py-2': isSidebarVisible, 'justify-center py-2 px-2': !isSidebarVisible}"
    >
      <svg class="h-5 w-5" [class.mr-3]="isSidebarVisible" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
      </svg>
      <span *ngIf="isSidebarVisible">{{ item.label }}</span>
    </a>
  </nav>

  <!-- Settings Button (Footer) -->
  <div class="px-2 py-4 border-t border-gray-200" *ngIf="!isSettingsRouteActive">
    <a
      [routerLink]="['/settings']"
      routerLinkActive="bg-gray-100 text-black font-semibold"
      [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
      class="flex items-center text-gray-700 rounded-md hover:bg-gray-100 text-lg"
      [ngClass]="{'px-4 py-2': isSidebarVisible, 'justify-center py-2 px-2': !isSidebarVisible}"
    >
      <svg class="h-5 w-5" [class.mr-3]="isSidebarVisible" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
      <span *ngIf="isSidebarVisible">Cài đặt</span>
    </a>
  </div>
</div>
