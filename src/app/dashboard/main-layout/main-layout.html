<div class="flex h-screen bg-gray-100">
  <!-- Sidebar will be here -->
  <div
    class="bg-white border-r border-gray-200 transition-all duration-300 ease-in-out overflow-hidden"
    [class.w-64]="isSidebarVisible"
    [class.w-16]="!isSidebarVisible"
  >
    <!-- Placeholder for Sidebar Component -->
    <app-sidebar [isSidebarVisible]="isSidebarVisible"></app-sidebar>
  </div>

  <!-- Main Content Area -->
  <div
    class="flex flex-col flex-1 transition-all duration-300 ease-in-out"
    [class.ml-64]="isSidebarVisible"
    [class.ml-0]="!isSidebarVisible"
  >
    <!-- Topbar will be here -->
    <app-topbar [isSidebarVisible]="isSidebarVisible" (toggleSidebar)="toggleSidebar()"></app-topbar>

    <!-- Main content area -->
    <main class="flex-1 p-6">
      
    </main>
  </div>
</div>
