<nav class="flex items-center text-base py-2">
  <ng-container *ngIf="breadcrumbData$ | async as breadcrumbOutput">
    <!-- Dashboard Mode Breadcrumb: [Tên Cấp Cha] < [Tên Cấp Con] -->
    <ng-container *ngIf="!breadcrumbOutput.isSettingsPage">
      <ol class="flex items-center gap-2">
        <li *ngFor="let item of breadcrumbOutput.items; let last = last; let i = index">
          <span
            [ngClass]="{
              'text-black font-semibold': item.isCurrent,
              'text-gray-500': !item.isCurrent
            }"
          >
            {{ item.label }}
          </span>
          <span *ngIf="!last" class="text-gray-500"> &lt; </span>
        </li>
      </ol>
    </ng-container>

    <!-- Setting Mode Breadcrumb: < [Tên Cấp Cha] < [Tên Cấp Con] -->
    <ng-container *ngIf="breadcrumbOutput.isSettingsPage">
      <ol class="flex items-center gap-2">
        <li *ngFor="let item of breadcrumbOutput.items; let last = last; let i = index">
          <!-- Render clickable '<' only if backLink exists -->
          <a
            [routerLink]="item.backLink"
            class="px-1 cursor-pointer text-blue-500 hover:text-blue-700 flex items-center"
            *ngIf="item.backLink"
          >
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </a>
          <!-- Label part -->
          <span
            [ngClass]="{
              'text-black font-semibold': item.isCurrent,
              'text-gray-500': !item.isCurrent
            }"
          >
            {{ item.label }}
          </span>
        </li>
      </ol>
    </ng-container>
  </ng-container>
</nav>
